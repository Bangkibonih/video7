<script>
let devices=[];
let selectedIndex=null;

function createCard(no){
  let card = document.createElement("div");
  card.style.background="#fff";
  card.style.padding="12px";
  card.style.margin="10px";
  card.style.borderRadius="10px";
  card.innerHTML=`
    <b>${no}</b><br>
    Sent: <span class="sent">0</span><br>
    Delivered: <span class="deliv">0</span><br>
    Profit: <span class="profit">0</span>
  `;
  document.body.appendChild(card);
  return card;
}

function addDevice(no){
  let card=createCard(no);
  let dev={no,sent:0,deliv:0,profit:0,speed:0,multi:0,interval:null,el:card};
  devices.push(dev);
}

function setMode(dev,label){
  clearInterval(dev.interval);

  if(label.includes("OFF")) return;

  if(label.includes("MENIT")){dev.speed=60000; dev.multi=1;}
  else if(label.includes("SLOW")){dev.speed=20000; dev.multi=1;}
  else if(label.includes("NORMAL")){dev.speed=10000; dev.multi=1;}
  else if(label.includes("FAST (5")){dev.speed=5000; dev.multi=1;}
  else if(label.includes("DETIK")){dev.speed=1000; dev.multi=1;}
  else if(label.includes("30")){dev.speed=1000; dev.multi=30;}
  else if(label.includes("40")){dev.speed=1000; dev.multi=40;}
  else if(label.includes("50")){dev.speed=1000; dev.multi=50;}

  dev.interval=setInterval(()=>{
    dev.sent+=dev.multi;
    dev.deliv+=dev.multi;
    dev.profit+=700*dev.multi;

    dev.el.querySelector(".sent").innerText=dev.sent;
    dev.el.querySelector(".deliv").innerText=dev.deliv;
    dev.el.querySelector(".profit").innerText=dev.profit;
  },dev.speed);
}

setTimeout(()=>{
  document.querySelectorAll("button").forEach(btn=>{
    if(btn.innerText.toLowerCase().includes("pair")){
      btn.onclick=()=>{
        let no=prompt("Masukkan nomor");
        if(no){
          addDevice(no);
          selectedIndex=devices.length-1;
        }
      }
    }
  });

  document.body.addEventListener("click",e=>{
    if(!e.target.innerText) return;
    if(selectedIndex!==null){
      setMode(devices[selectedIndex], e.target.innerText);
    }
  });

  document.querySelectorAll("a").forEach(a=>{
    a.onclick=(e)=>e.preventDefault();
  });

},1500);
</script>
