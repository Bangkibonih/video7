<script>
let connected=false, sent=0, deliv=0, profit=0, saldo=0;
let interval=null, speed=1000, multi=1;

function updateUI(){
  document.querySelectorAll("*").forEach(el=>{
    if(el.innerText==="0"){
      el.innerText=sent;
    }
  });
}

function pair(){
  connected=true;
  alert("Simulasi: Device Connected");
}

function setMode(label){
  clearInterval(interval);

  if(label.includes("OFF")) return;

  if(label.includes("1 DETIK")){speed=1000; multi=1;}
  else if(label.includes("FAST (5")){speed=5000; multi=1;}
  else if(label.includes("NORMAL")){speed=10000; multi=1;}
  else if(label.includes("SLOW")){speed=20000; multi=1;}
  else if(label.includes("30 CHAT")){speed=1000; multi=30;}
  else if(label.includes("40 CHAT")){speed=1000; multi=40;}
  else if(label.includes("50 CHAT")){speed=1000; multi=50;}
  else if(label.includes("1 MENIT")){speed=60000; multi=1;}

  interval=setInterval(()=>{
    sent+=multi;
    deliv+=multi;
    profit+=700*multi;
    saldo+=700*multi;
    updateUI();
  }, speed);
}

function withdraw(){
  let amt=prompt("Nominal withdraw:");
  amt=parseInt(amt);
  if(amt>saldo){alert("Saldo kurang"); return;}
  saldo-=amt;
  alert("Withdraw berhasil (simulasi)");
}

setTimeout(()=>{
  document.querySelectorAll("button").forEach(btn=>{
    let t=btn.innerText.toUpperCase();
    if(t.includes("PAIR")||t.includes("SCAN")){
      btn.onclick=pair;
    }
  });

  document.body.addEventListener("click", e=>{
    if(e.target.innerText){
      setMode(e.target.innerText);
    }
  });
},1000);
</script>
